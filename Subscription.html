<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShipDecKK - Subscription</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1 class="header">Subscription</h1>
        <nav class="link">
            <a href="./Homepage.html">Home</a>
            <a href="./Gallery.html">Gallery</a>
            <a href="./Services.html">Services</a>
            <a href="./AboutUs.html">About Us</a>
            <a href="./Subscription.html">Subscription</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Subscribe for Updates</h2>
            <p>Sign up to receive promotions, news, and updates from ShipDecKK.</p>

            <form id="subscriptionForm" action="#" method="post">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Create a password">
                </div>

                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" placeholder="Enter your age">
                </div>

                <div class="form-group">
                    <label for="newsletter">Newsletter Frequency:</label>
                    <select id="newsletter" name="newsletter">
                        <option value="">Select an option</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="quarterly">Quarterly</option>
                        <option value="Never">Never</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit">Subscribe</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 ShipDecKK. All rights reserved.</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
